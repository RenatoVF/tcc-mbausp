metadata:
  name: "Garantir que instancias RDS em ambiente HML sejam da familia t"
  id: "CKV_FINOPS_04B"
  category: "CONVENTION"
definition:
  or:
    - cond_type: "attribute"
      resource_types:
        - "aws_db_instance"
      attribute: "tags.Ambiente"
      operator: "not_equals"
      value: "HML"
    - cond_type: "attribute"
      resource_types:
        - "aws_db_instance"
      attribute: "instance_class"
      operator: "starting_with"
      value: "db.t"