metadata:
  name: "Garantir que instancias EC2 em ambiente HML sejam da familia t"
  id: "CKV_FINOPS_04A"
  category: "CONVENTION"
definition:
  or:
    - cond_type: "attribute"
      resource_types:
        - "aws_instance"
      attribute: "tags.Ambiente"
      operator: "not_equals"
      value: "HML"
    - cond_type: "attribute"
      resource_types:
        - "aws_instance"
      attribute: "instance_type"
      operator: "starting_with"
      value: "t"