services:
  checkov:
    image: bridgecrew/checkov:latest
    volumes:
      - ./rules:/rules:ro
      - ${TFVARS_DIR:-../../training_set/sadcloud/tfvars}:/data:ro
      - ${OUT_DIR:-../../training_set/checkov/out}:/out:rw
      - ./run_checkov_all.sh:/scripts/run_checkov_all.sh:ro
    working_dir: /data
    entrypoint: ["/bin/sh", "-c"]
