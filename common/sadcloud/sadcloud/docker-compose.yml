services:
  terraform:
    image: hashicorp/terraform:latest
    env_file:
      - .env
    volumes:
      - .:/infra # Mounts current directory to the container
      - ../modules:/modules
      - ../scripts:/scripts:ro
      - ${TFVARS_DIR:-../../../training_set/sadcloud/tfvars}:/tfvars
    working_dir: /infra
    entrypoint: ["/bin/terraform"]
